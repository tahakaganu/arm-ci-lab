apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: jenkins
  namespace: argocd
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: jenkins
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: [CreateNamespace=true]
  sources:
    - repoURL: https://charts.jenkins.io
      chart: jenkins
      targetRevision: "5.13.3"
      helm:
        valueFiles:
          - $values/k8s/jenkins/values.yaml
    - repoURL: https://github.com/tahakaganu/arm-ci-lab.git
      targetRevision: main
      ref: values