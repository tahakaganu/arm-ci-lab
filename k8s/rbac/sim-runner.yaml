apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: { name: sim-runner, namespace: jenkins }
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "get", "list", "watch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: { name: sim-runner, namespace: jenkins }
subjects:
  - kind: ServiceAccount
    name: jenkins-agent
    namespace: jenkins
roleRef:
  kind: Role
  name: sim-runner
  apiGroup: rbac.authorization.k8s.io