apiVersion: v1
kind: Pod
spec:
  serviceAccountName: jenkins-agent
  nodeSelector:
    kubernetes.io/arch: amd64
  containers:
    - name: python
      image: python:3.12-slim
      command: ["sleep"]
      args: ["99d"]
    - name: aws
      image: amazon/aws-cli:latest
      command: ["sleep"]
      args: ["99d"]
    - name: kaniko
      image: gcr.io/kaniko-project/executor:debug
      command: ["sleep"]
      args: ["99d"]
